<div id="pun-inventory-item-form" class="main inventory-item-form">
  <app-breadcrumbs [items]="breadcrumbs()"></app-breadcrumbs>
  @if (!loading()) {
    <div class="main-header">
      <h1>
        @if (itemId()) {
          <ng-container i18n="@@inventoryform.titleEdit">Edit item</ng-container>
        } @else {
          <ng-container i18n="@@inventoryform.titleCreate">Add item</ng-container>
        }
      </h1>
    </div>

    <form class="form-container" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="item-name" i18n="@@inventoryform.name">Name</label>
        <input id="item-name" type="text" [(ngModel)]="name" name="name" maxlength="255" required />
      </div>

      <div class="form-group">
        <label i18n="@@inventoryform.icon">Icon (150 × 150 px)</label>
        @if (canUpload()) {
          <app-cropped-image-field
            #croppedImageRef
            [fieldValue]="iconUrl"
            [showFieldName]="false"
            [width]="iconSize"
            [height]="iconSize">
          </app-cropped-image-field>
        } @else {
          <input type="url" [(ngModel)]="iconUrl" name="icon_url" maxlength="512" />
        }
      </div>

      <div class="form-group">
        <label for="item-description" i18n="@@inventoryform.description">Description</label>
        <textarea id="item-description" rows="5" [(ngModel)]="description" name="description"></textarea>
      </div>

      <div class="form-group">
        <label>
          <input type="checkbox" [(ngModel)]="isHidden" name="is_hidden" />
          <ng-container i18n="@@inventoryform.hidden">Hidden — not shown on the arc page</ng-container>
        </label>
      </div>

      <div class="form-group form-group--narrow">
        <label for="item-order" i18n="@@inventoryform.displayOrder">Display order</label>
        <input id="item-order" type="number" [(ngModel)]="displayOrder" name="display_order" />
      </div>

      @if (errorMessage()) {
        <p class="error-msg">{{ errorMessage() }}</p>
      }

      <div class="form-actions">
        <app-save-button [state]="saveState()" (clicked)="submit()">
          <span i18n="@@common.save">Save</span>
        </app-save-button>
        @if (itemId()) {
          <a class="button" [routerLink]="['/inventory-item', itemId()]" i18n="@@common.cancel">Cancel</a>
          <button type="button" class="button" (click)="deleteItem()" i18n="@@common.delete">Delete</button>
        } @else {
          <a class="button" [routerLink]="['/arc', arcId()]" i18n="@@common.cancel">Cancel</a>
        }
      </div>
    </form>
  }
</div>
