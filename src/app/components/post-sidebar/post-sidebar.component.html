<h2>
  <span i18n="@@postform.quickReply">Quick reply</span>
  <button type="button" class="sidebar-toggle-btn" (click)="toggle()" [title]="sidebarMode() ? 'Exit sidebar mode' : 'Open in sidebar'">
    @if (sidebarMode()) {
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
    } @else {
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
    }
  </button>
</h2>
<ng-content></ng-content>
