@if (puzzle) {
  <div class="puzzle-achievements-page">
    <div class="puzzle-achievements-header">
      <h1>{{ puzzle.title }} — <ng-container i18n="@@puzzles.achievements">Achievements</ng-container></h1>
      <a [routerLink]="['/puzzle', puzzle.id]" i18n="@@puzzles.backToPuzzle">Back to puzzle</a>
    </div>

    @if (loading) {
      <p i18n="@@common.loading">Loading...</p>
    } @else if (achievements.length === 0) {
      <p i18n="@@puzzles.noAchievements">No achievements yet. Be the first!</p>
    } @else {
      <div class="achievements-grid">
        @for (a of achievements; track a.id) {
          <div class="achievement-card">
            <img [src]="a.screenshot_url" [alt]="puzzle.title" class="achievement-screenshot" />
            <div class="achievement-meta">
              <span class="achievement-date">{{ a.date.slice(0, 10) }}</span>
            </div>
          </div>
        }
      </div>
    }
  </div>
}
