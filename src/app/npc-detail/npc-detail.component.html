<div id="pun-npc-detail" class="main npc-detail">
  <app-breadcrumbs [items]="breadcrumbs()"></app-breadcrumbs>
  @if (!loading()) {
    @if (error()) {
      <p i18n="@@npcdetail.error">Could not load NPC data.</p>
    } @else if (npc()) {
      <div class="main-header">
        <h1>{{ npc()!.name }}</h1>
        @if (npc()!.can_edit) {
          <div class="main-header-controls">
            <a class="button" [routerLink]="['/npc', npc()!.id, 'edit']" i18n="@@npcdetail.edit">Edit</a>
          </div>
        }
      </div>

      <div class="npc-profile">
        @if (npc()!.avatar) {
          <div class="npc-profile-avatar">
            <img [src]="npc()!.avatar!" [alt]="npc()!.name" />
          </div>
        }

        @if (npc()!.description) {
          <div class="npc-profile-description">{{ npc()!.description }}</div>
        }
      </div>
    }
  }
</div>
