<app-breadcrumbs [items]="breadcrumbs()"></app-breadcrumbs>

<div id="pun-main" class="main lore-page">
  <div class="lore-layout">
    <nav class="lore-nav">
      <ul>
        @for (page of pages(); track page.id) {
          @if (!page.is_hidden) {
            <li>
              @if (page.is_external_link) {
                <a [id]="'lore-nav-link-' + page.id" class="lore-nav-link external-link" [href]="page.external_link" target="_blank" rel="noopener noreferrer">{{ page.name }}</a>
              } @else {
                <a [id]="'lore-nav-link-' + page.id" class="lore-nav-link post-link" [routerLink]="['/lore', topicId(), 'page', page.post_id]">{{ page.name }}</a>
              }
            </li>
          }
        }
      </ul>
    </nav>

    <div class="main-content">
      @if (post(); as p) {
        <div class="page-content" appRouterLinks [innerHTML]="p.content_html | safeHtml"></div>
      }
    </div>
  </div>
</div>

<app-breadcrumbs [items]="breadcrumbs()"></app-breadcrumbs>
