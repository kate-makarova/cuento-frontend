@if (agent(); as a) {
  <h2>{{ a.title }}</h2>
  <p>{{ a.short_description }}</p>

  <table>
    <thead>
      <tr>
        <th i18n="@@adminAiAgent.colTitle">Title</th>
        <th i18n="@@adminAiAgent.colActive">Active</th>
        <th></th>
      </tr>
    </thead>
    <tbody>
      @for (impl of a.implementations; track impl.id) {
        <tr>
          <td>{{ impl.title }}</td>
          <td>
            @if (impl.is_active) {
              <span class="status-active" i18n="@@common.yes">Yes</span>
            } @else {
              <span class="status-inactive" i18n="@@common.no">No</span>
            }
          </td>
          <td class="table-actions">
            <button type="button" (click)="edit(impl)" i18n="@@common.edit">Edit</button>
            <button type="button" class="btn-decline" (click)="delete(impl)" i18n="@@common.delete">Delete</button>
          </td>
        </tr>
      } @empty {
        <tr>
          <td colspan="3" i18n="@@adminAiAgent.empty">No implementations yet.</td>
        </tr>
      }
    </tbody>
  </table>

  <div class="list-actions">
    <button type="button" class="btn-secondary" (click)="addImplementation()" i18n="@@adminAiAgent.addImplementation">Add Implementation</button>
  </div>
}
