<app-breadcrumbs [items]="[
  { label: 'Admin', link: '/admin' },
  { label: 'Custom Templates', link: '/admin/frontend-templates' },
  { label: name() }
]" />

<div class="template-container">
  <div class="template-header">
    <div class="header-title">
      <h2>
        {{ name() }}
        @if (readonly()) {
          <span class="badge-readonly" i18n="@@admin.componentTemplate.readonlyBadge">default</span>
        }
        @if (isCreate()) {
          <span class="badge-create" i18n="@@admin.componentTemplate.createBadge">new version</span>
        }
      </h2>
      @if (filePath()) {
        <code class="file-path">{{ filePath() }}</code>
      }
    </div>
    @if (!readonly()) {
      <app-save-button [state]="saveState()" (clicked)="save()">
        <span i18n="@@common.save">Save</span>
      </app-save-button>
    }
  </div>

  @if (!readonly()) {
    <div class="version-name-row">
      <label class="version-name-label" for="version-name" i18n="@@admin.componentTemplate.versionName">Version name</label>
      <input
        id="version-name"
        class="version-name-input"
        type="text"
        [value]="versionName()"
        (input)="versionName.set($any($event.target).value)"
        i18n-placeholder="@@admin.componentTemplate.versionNamePlaceholder"
        placeholder="e.g. Christmas theme"
      />
    </div>
  }

  <div class="editor-wrap" [class.editor-wrap--readonly]="readonly()">
    <app-html-editor
      [value]="content()"
      [readonly]="readonly()"
      (valueChange)="updateContent($event)"
    />
  </div>
</div>
